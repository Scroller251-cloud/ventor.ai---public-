name: Ventor production gate

on:
  push:
    branches: [main, 'production/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q backend Ventor_2_9 tests
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: python -m pip install pip-audit && pip-audit -r requirements.txt

  container:
    name: container-smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t ventor:ci .
      - name: Container smoke test
        run: |
          docker run -d --name ventor-ci -p 18000:8000 ventor:ci
          trap 'docker logs ventor-ci || true; docker rm -f ventor-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health; then exit 0; fi
            sleep 2
          done
          exit 1
