name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip cryptography pytest
      - name: Compile public Python source
        run: python -m compileall -q backend
      - name: Run tests when present
        shell: bash
        run: |
          if compgen -G 'tests/test_*.py' > /dev/null; then
            python -m pytest -q
          else
            echo 'No tests directory in this public snapshot; compile check completed.'
          fi
