services:
  ventor:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      VENTOR_PRODUCTION: "1"
      VENTOR_CORS_ORIGINS: "http://127.0.0.1:8000"
      VENTOR_MEMORY_DB: "/app/backend/data/memory.db"
      VENTOR_WORKSPACE: "/app/backend/workspace"
    volumes:
      - ventor-data:/app/backend/data
      - ventor-workspace:/app/backend/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ventor-data:
  ventor-workspace:
