<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d14"><title>Ventor — Private AI</title>
<style>
:root{--bg:#080b12;--panel:#101621;--border:#273247;--text:#eef2f7;--muted:#8c98ab;--accent:#e8a33d;--ok:#4ac9b8;--bad:#e56b7e}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 80% 0,#182338 0,#080b12 42%);color:var(--text);font:14px system-ui,sans-serif}.app{height:100%;display:grid;grid-template-columns:220px 1fr}.side{background:#0d121cdd;border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:6px}.brand{font-weight:800;letter-spacing:4px;padding:8px 6px 24px}.nav{background:none;border:0;color:var(--muted);padding:10px;border-radius:9px;text-align:left;cursor:pointer}.nav:hover,.nav.active{background:#151d2b;color:var(--text)}.foot{margin-top:auto;color:#657084;font-size:11px}.main{min-width:0;height:100%;display:flex;flex-direction:column}.top{height:54px;border-bottom:1px solid #141c2a;display:flex;align-items:center;justify-content:center;color:var(--muted)}.content{flex:1;overflow:auto;width:min(960px,100%);margin:auto;padding:28px 24px 100px}.composer{position:fixed;bottom:18px;left:calc(220px + (100vw - 220px)/2);transform:translateX(-50%);width:min(850px,calc(100vw - 270px));display:flex;gap:8px;background:#101621ee;border:1px solid var(--border);border-radius:14px;padding:8px}.composer textarea{flex:1;background:none;border:0;outline:0;color:var(--text);resize:none;padding:8px;font-size:15px}.send,.primary{border:0;background:var(--accent);color:#201707;border-radius:9px;font-weight:700;cursor:pointer}.send{width:42px}.msg{display:flex;gap:10px;margin:18px 0}.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#151d2b;flex:none}.bot .av{background:var(--accent);color:#201707}.role{font-size:10px;color:#68758a;text-transform:uppercase;margin-bottom:5px}.text{white-space:pre-wrap;line-height:1.7}.card{background:#101621cc;border:1px solid var(--border);border-radius:11px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.muted{color:var(--muted)}.login{position:fixed;inset:0;background:#03050ae8;display:grid;place-items:center;z-index:10}.loginbox{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:24px;width:min(460px,92%)}.loginbox input{width:100%;padding:11px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;margin:7px 0 12px}.primary{padding:10px 15px}.danger{color:var(--bad)}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:20px 15px 100px}.composer{left:50%;width:calc(100vw - 28px)}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">VENTOR</div><button class="nav active" onclick="showChat()">✦ Chat</button><button class="nav" onclick="showModels()">◇ Models</button><button class="nav" onclick="showMemory()">◎ Memory</button><button class="nav" onclick="showLearning()">↗ Learning</button><button class="nav" onclick="showSystem()">◈ System</button><button class="nav" onclick="showSafety()">✓ Safety</button><div class="foot">Owner-controlled<br>Local persistent memory<br>Adaptive routing</div></aside><main class="main"><header class="top"><span id="status">●</span>&nbsp; Ventor <span id="clock" class="muted"></span></header><section id="content" class="content"></section><div class="composer"><textarea id="input" rows="1" maxlength="100000" placeholder="Message Ventor…"></textarea><button class="send" onclick="send()">↑</button></div></main></div>
<div id="login" class="login"><div class="loginbox"><h2>Owner authentication</h2><p class="muted">Ed25519 challenge/response. The private key stays in this browser.</p><label>Key ID</label><input id="keyId" autocomplete="off"><label>PKCS#8 private key (base64)</label><input id="privateKey" type="password" autocomplete="off"><button class="primary" onclick="login()">Authenticate</button><p id="loginerr" class="muted"></p></div></div>
<script src="/creator-login.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const auth=()=>VentorOwnerAuth.getAuthorizationHeader();
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...auth()};const r=await fetch(url,{...opt,cache:'no-store'});if(r.status===401){showLogin();throw Error('Authentication required')}const d=await r.json().catch(()=>({detail:'Invalid server response'}));if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}
function showLogin(){$('login').style.display='grid'}async function login(){try{await VentorOwnerAuth.authenticate({keyId:$('keyId').value.trim(),privateKeyBase64:$('privateKey').value.trim()});$('privateKey').value='';$('login').style.display='none';showChat();health()}catch(e){$('loginerr').textContent=e.message}}function logout(){VentorOwnerAuth.logout();showLogin()}
function msg(role,text){return `<div class="msg ${role==='Ventor'?'bot':''}"><div class="av">${role==='Ventor'?'V':'Y'}</div><div><div class="role">${role}</div><div class="text">${esc(text)}</div></div></div>`}
function showChat(){ $('content').innerHTML='<div style="text-align:center;padding-top:20vh"><h1>Ventor is ready.</h1><p class="muted">Reason · Research · Verify · Remember · Improve</p></div>' }
async function send(){const input=$('input'),value=input.value.trim();if(!value)return;if($('content').textContent.includes('Ventor is ready'))$('content').innerHTML='';$('content').insertAdjacentHTML('beforeend',msg('You',value)+msg('Ventor','Thinking…'));input.value='';try{const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value,session:'default'})});$('content').lastElementChild.querySelector('.text').textContent=d.text||'No response'}catch(e){$('content').lastElementChild.querySelector('.text').textContent=e.message}}
async function showModels(){try{const d=await api('/api/context');$('content').innerHTML='<h2>Models & providers</h2>'+Object.entries(d.providers).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><p class="muted">${v.configured?'Configured':'Not configured'} · ${v.healthy?'healthy':'circuit open'} · ${v.last_latency_ms||0} ms</p></div>`).join('')}catch(e){$('content').innerHTML='<div class="card danger">'+esc(e.message)+'</div>'}}
async function showMemory(){try{const d=await api('/api/memory');$('content').innerHTML='<h2>Private memory</h2>'+d.recent.slice(-20).map(x=>`<div class="card"><b>${esc(x.role)}</b><p>${esc(x.content)}</p></div>`).join('')}catch(e){$('content').innerHTML='<div class="card danger">'+esc(e.message)+'</div>'}}
async function showLearning(){try{const d=await api('/api/learning/status');$('content').innerHTML='<h2>Verified learning</h2><pre class="card">'+esc(JSON.stringify(d,null,2))+'</pre>'}catch(e){$('content').innerHTML='<div class="card danger">'+esc(e.message)+'</div>'}}
async function showSystem(){try{const d=await api('/metrics');$('content').innerHTML='<h2>System telemetry</h2><pre class="card">'+esc(JSON.stringify(d,null,2))+'</pre>'}catch(e){$('content').innerHTML='<div class="card danger">'+esc(e.message)+'</div>'}}
async function showSafety(){try{const d=await api('/api/context');$('content').innerHTML='<h2>Safety</h2>'+d.capabilities.map(x=>`<div class="card"><b>${esc(x.name)}</b> · ${esc(x.risk)}<p class="muted">${esc(x.description)}</p></div>`).join('')}catch(e){$('content').innerHTML='<div class="card danger">'+esc(e.message)+'</div>'}}
async function health(){try{const r=await fetch('/health',{cache:'no-store'});$('status').textContent=r.ok?'●':'●';const d=await api('/api/context');$('clock').textContent=' · '+d.time.date+' '+d.time.time+' '+d.time.timezone}catch(e){$('status').textContent='●'}}
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});showChat();if(VentorOwnerAuth.getAuthorizationHeader().Authorization){$('login').style.display='none'}health();setInterval(health,15000);
</script></body></html>
